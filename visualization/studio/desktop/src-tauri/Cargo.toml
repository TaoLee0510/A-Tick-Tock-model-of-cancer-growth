[package]
name = "atcg3d-studio"
version = "0.1.0"
description = "ATCG3D simulation control and visualization desktop app"
authors = ["ATCG3D"]
edition = "2021"

[lib]
name = "atcg3d_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = [] }
