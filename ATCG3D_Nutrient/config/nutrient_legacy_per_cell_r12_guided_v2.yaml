schema:
  name: atcg3d.nutrient_model_config
  version: 2
profile: nutrient_legacy_per_cell_r12_guided_v2
base_config: ../../configs/atcg2d_legacy_native_r20_aligned_v3.yaml

nutrient:
  model: effective_resource_surplus_v1
  solver: deterministic_quasi_steady_jacobi_v1
  block_edge: 4
  halo_voxels: 16
  diffusion_voxels2_per_hour: 1.0
  decay_per_hour: 0.006944444444444444
  vessel_exchange_per_hour: 10.0
  vessel_value: 1.0
  consumption:
    K_per_cell_hour: 0.01
    r_to_K_ratio: 1.2
    half_saturation: 0.25
  capacity:
    half_saturation: 0.25
    maximum_multiplier: 2.0
  refresh_every_hours: 4.0
  solver_iterations: 128
  relaxation: 0.8
  output:
    directory: atcg3d_nutrient_legacy_per_cell_r12_guided_v2_run
    metrics_every_hours: 1.0
    field_snapshot_every_hours: 0.0
