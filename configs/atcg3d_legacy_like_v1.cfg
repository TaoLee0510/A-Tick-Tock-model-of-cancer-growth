# Versioned, adjustable defaults for the first 3D interpretation of the 2D model.
schema.version = 1
profile = legacy_like_v1
rng.seed = 1

space.domain_policy = expandable_sparse
space.chunk_edge = 32
space.thin_layer = false

direction.set = fixed_26_v1
direction.continue_probability = 0.90
direction.turn_half_angle_deg = 45.0
direction.density_radius = 5
direction.density_half_angle_deg = 45.0
direction.density_threshold = 0.60
direction.persistence_uses_density = false
direction.distance_weight_exponent = 0.0

migration.activation_enabled = true
migration.activation_window_edge = 70
migration.activation_block_edge = 32
migration.activation_threshold = 0.90

density.backend = block_anchor_v1
density.block_edge = 4
density.growth_window_edge = 6
density.capacity_scale_2d_to_3d = 6.0

biology.r_limit = 24.0
biology.K_limit = 24.0
biology.carrying_capacity_r = 186.0
biology.carrying_capacity_K = 216.0
biology.alpha = 0.0
biology.beta = 0.0
biology.r_death_delay_hours = 72.0
biology.K_death_delay_hours = 72.0

division.shell_radius = 2
division.allow_shape_reduction = true
stage.large_footprint_edge = 2
stage.small_footprint_voxels = 1
stage.ultrasmall_enabled = true

initial.r_cells = 32
initial.K_cells = 32
initial.radius = 8
initial.shell_thickness = 2
initial.r_growth_rate = 1.0
initial.K_growth_rate = 1.0
initial.r_migration_rate = 0.25
initial.K_migration_rate = 0.25

simulation.end_time_hours = 24.0
simulation.max_events = 1000000
simulation.threads = 1
scheduler.backend = event_queue_v1
# 0 uses the exact event time bits for deterministic conflict priority.
scheduler.conflict_bucket_hours = 0.0

# Set true only in a build configured with ATCG3D_ENABLE_VTKHDF. With the
# checkpoint interval below, ATCG3D_ENABLE_HDF5_CHECKPOINT is also required.
output.enabled = false
output.preview_mode = stable_uid_hash_v1
output.full_format = vtkhdf_points_v1
output.checkpoint_format = hdf5_v1
output.directory = atcg3d_run
output.preview_every_hours = 1.0
output.full_every_hours = 6.0
output.checkpoint_every_hours = 24.0
output.preview_max_cells = 1000000
output.preview_seed = 0
